<!DOCTYPE html>
<html>
<head>
<style>
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: #111; color: #ccc; font-family: monospace; font-size: 15px; }
.shell { position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden; padding: 8px; }
.transcript { flex: 1 1 0; min-height: 0; overflow: auto; background: rgba(255,0,0,0.1); padding: 10px; }
.composer { flex-shrink: 0; padding: 10px; background: rgba(0,255,0,0.1); }
textarea { width: 100%; min-height: 24px; max-height: 50vh; border: 0; outline: 0; resize: none; overflow-y: hidden; background: transparent; color: #ccc; font: inherit; }
</style>
</head>
<body>
<div class="shell">
  <div class="transcript">TRANSCRIPT<br>line<br>line<br>line<br>line<br>line<br>line<br>line<br>line<br>line<br>line<br>line<br>line<br>line<br>line<br>line<br>line<br>line<br>line<br>line<br>line</div>
  <div class="composer">
    <textarea id="ta" placeholder="type here..."></textarea>
  </div>
</div>
<script>
document.getElementById('ta').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = this.scrollHeight + 'px';
});
</script>
</body>
</html>
